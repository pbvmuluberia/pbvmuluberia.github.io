<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="manifest" href="../../../../manifest.json">

  <link rel="apple-touch-icon" href="./src/icons/icon-192x192.png">
  <meta name="apple-mobile-web-app-status-bar" id="meta-apple-status-bar" content="#bf530c">
  <meta name="theme-color" id="meta-theme-color" content="#bf530c">

  <script src="../../script/theme-pwa.js"></script>
  <title>Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Assuming qrcodejs is used elsewhere, kept for compatibility -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      // 1. Restore Theme immediately
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-theme');
      }

      // 2. Restore Language immediately
      window.savedLang = localStorage.getItem('language') || 'bn';
    })();
  </script>

  <!-- Global Styles (Assumed to contain :root variables) -->
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <!-- Page Specific Styles (Updated below) -->
  <link rel="stylesheet" href="../../css/results.css">

  <!-- Scripts (Assuming these local paths are correct) -->
  <script src="../../script/components.js" defer></script>
  <script src="../../script/data.js" defer></script>
  <script src="../../script/utils.js" defer></script>
  <script src="../../script/init.js" defer></script>

</head>

<body>
  <!-- Navbar Placeholder -->
  <nav class="menu">
    <img src="https://raw.githubusercontent.com/t4saha/PBVM-Uluberia-Vigyan-Kendra/main/Logo/pvbm_logo_gold.png"
      alt="Logo" class="nav-logo"
      onerror="this.onerror=null; this.src='https://placehold.co/50x50/d79921/3c3836?text=LOGO'">

    <div class="menu-controls-mobile">
      <span class="menu-label-text" data-translate-key="nav_menu">Menu</span>
      <button class="hamburger-menu" id="hamburgerBtn" onclick="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span class="menu-label-text current-menu-label" id="currentMenuLabel">🪪</span>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="../../../../index.html" class="${isActive(menu_home)}" data-translate-key="nav_home">Home</a>
      <a href="./checkR.html" class="active-tab" data-translate-key="nav_check_details">Check Details</a>
    </div>

    <div class="header-controls">
      <div id="theme-placeholder"></div>
      <div class="lang-toggle">
        <span id="langEn" onclick="setLang('en')">EN</span>
        <span id="langBn" onclick="setLang('bn')">বা</span>
      </div>
    </div>
  </nav>

  <div class="results-container">
    <div class="results-header">
      <h1 data-translate-key="exam">Howrah Zilla Vigyan Manosikata-o-Medha Aviksha</h1>
      <h3 data-translate-key="uluberia">Uluberia Vigyan Kendra</h3>
    </div>

    <div class="search-form-card">
      <div class="input-group">
        <div style="align-self: right;">
          <label data-translate-key="formno_label" for="formno">Enter Form No:</label>
          <input data-translate-key="formno_placeholder" type="text" id="formno" placeholder="Enter Form No" required>
        </div>
        <div class="custom-select" style="align-self: right;">
          <select id="schoolList" name="school">
          </select>
        </div>
        <div class="btn-group" style="display: flex; gap: var(--space-sm);">
          <button id="searchBtn" class="donate-btn"
            style="align-self: center; border-radius: var(--border-radius-medium); padding: var(--space-sm) var(--space-md);"
            onclick="fetchData()" data-translate-key="search_result_button">Search Result</button>
          <button class="donate-btn"
            style="align-self: center; border-radius: var(--border-radius-medium); padding: var(--space-sm) var(--space-md);"
            id="correctionBtn" data-translate-key="correct" onclick="openCorrectionForm()">correct</button>
        </div>
      </div>

      <div id="result-display" data-translate-key="default_reg_display">
        Please enter your Form No and School above and click Search to check your registration
      </div>
    </div>

    <dialog id="correctionModal" style="background-color: var(--bg-color); color: var(--text-color);">
      <h2 data-translate-key="update_student_data">Update Student Data</h2>
      <form id="correctionForm">
        <div class="inputFormRow">
          <label for="formNO" data-translate-key="formno_label" disabled>Form No:</label>
          <input type="text" id="formNO" name="formNO" required>
        </div>
        <div class="inputFormRow">
          <label for="name" data-translate-key="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="inputFormRow">
          <label for="studentClass" data-translate-key="class">Class:</label>
          <select id="studentClass" name="studentClass" required>
            <option value="V">V</option>
            <option value="VI">VI</option>
            <option value="VII">VII</option>
            <option value="VIII">VIII</option>
            <option value="IX">IX</option>
            <option value="X">X</option>
            <option value="XI">XI</option>
            <option value="XII">XII</option>
          </select>
        </div>
        <div class="inputFormRow">
          <label for="medium" data-translate-key="medium">Medium:</label>
          <select id="medium" name="medium" required>
            <option value="BENGALI">Bengali</option>
            <option value="ENGLISH">English</option>
          </select>
        </div>
        <div class="inputFormRow">
          <label for="mobileNo" data-translate-key="mobileNo">Mobile No:</label>
          <input type="text" id="mobileNo" name="mobileNo" placeholder="Enter your mobile no" required>
        </div>
        <div class="inputFormRow" style="position:absolute; right: var(--space-md);">
          <button type="submit" id="submitBtn" class="donate-btn"
            style="align-self: center; border-radius: var(--border-radius-medium); padding: var(--space-sm) var(--space-md);"
            data-translate-key="submit_correction">Submit Correction</button>
        </div>

      </form>

      <div id="message"></div>


    </dialog>

    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbyJoBMePTLQw_tE8k1ymfjbtM7KSPa3pX0UGBiA3C3R7d-LGCNmBWxVbWOQdM3I944b6Q/exec";
      async function fetchData() {
        const formno = document.getElementById('formno').value;
        const school = document.getElementById('schoolList').value;
        const resultsDiv = document.getElementById('result-display');
        console.log(school)

        const school_name = school.trim();

        if (!school_name) {
          resultsDiv.setAttribute('data-translate-key', 'enter_valid_school');
          resultsDiv.innerHTML = 'Please select your school';
          resultsDiv.className = 'error';
          if (window.applyTranslations) window.applyTranslations();
          return;
        }

        if (!formno) {
          resultsDiv.setAttribute('data-translate-key', 'enter_valid_formno');
          resultsDiv.innerHTML = 'Please enter your offline Form No';
          resultsDiv.className = 'error';
          if (window.applyTranslations) window.applyTranslations();
          return;
        }

        //DISABLE BUTTON & SHOW LOADER
        searchBtn.disabled = true; // Disable the button
        resultsDiv.removeAttribute('data-translate-key');
        resultsDiv.innerHTML = '<div class="loader"><br></div>';


        try {
          // Construct the URL with query parameters
          const finalUrl = `${SCRIPT_URL}?formno=${encodeURIComponent(formno)}&school=${encodeURIComponent(school)}`;

          // Fetch from GAS (Google handles the Redirect/CORS automatically via this method)
          const response = await fetch(finalUrl);
          const data = await response.json();

          resultsDiv.innerHTML = ""; // Clear loader

          if (data.length > 0) {
            const student = data[0];

            const lang = getLang();

            const outputHTML = `
              <div class="result-success-content">
                  <table>
                      <thead>
                          <tr>
                              <th colspan="2" class="table-header"><span data-translate-key="registration_header">Howrah Zilla Vigyan Manosikata-o-Medha Aviksha</span> - 2026</th>
                          </tr>
                      </thead>
                      <tbody>
                          <tr>
                              <td data-translate-key="name">Name:</td>
                              <td id="sName">${student.name}</td>
                          </tr>
                          <tr>
                              <td data-translate-key="class">Class:</td>
                              <td id="sClass">${student.class}</td>
                          </tr>
                          <tr>
                              <td data-translate-key="medium">Medium:</td>
                              <td id="sMedium">${student.medium}</td>
                          </tr>
                      </tbody>
                  </table>
              </div>`;

            resultsDiv.innerHTML = outputHTML;
            resultsDiv.className = 'success';
          } else if (data.length === 0) {
            resultsDiv.innerHTML = '<div data-translate-key="no_students_found">No students found.</div>';
            resultsDiv.className = 'error';
          } else {
            const lang = getLang();
            const template = window.translations[lang]['api_error'] || window.translations['en']['api_error'];
            const finalMessage = template.replace('${data.message}', data.message);
            resultDiv.innerHTML = finalMessage;
            resultDiv.className = 'error';
          }

        } catch (error) {
          console.error(error);
          resultsDiv.innerHTML = "Error fetching data. Ensure your Script is deployed as 'Anyone'.";
        } finally {
          // 4. RE-ENABLE BUTTON (Runs on both Success and Error)
          searchBtn.disabled = false;
        }

        if (window.applyTranslations) {
          window.applyTranslations();
        }
      }

      const correctionModal = document.getElementById('correctionModal');
      const correctionBtn = document.getElementById('correctionModal');

      // Open the modal
      function openCorrectionForm() {
        const studentName = document.getElementById("sName").textContent;
        const studentClass = document.getElementById("sClass").textContent;
        const studentMedium = document.getElementById("sMedium").textContent;
        const studentFormNo = document.getElementById("formno").value;

        document.getElementById("name").value = studentName;
        document.getElementById("studentClass").value = studentClass;
        document.getElementById("medium").value = studentMedium;
        document.getElementById("formNO").value = studentFormNo;

        correctionModal.showModal();
      }

      document.getElementById("correctionForm").addEventListener("submit", function (e) {
        e.preventDefault(); // Prevent page from reloading

        var messageDiv = document.getElementById("message");
        var submitBtn = document.getElementById("submitBtn");

        messageDiv.style.color = "blue";
        messageDiv.innerText = "Submitting data...";
        submitBtn.disabled = true;

        // REPLACE THIS URL WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
        var webAppUrl = "https://script.google.com/macros/s/AKfycbw8dcaLI2FSOHw2ycEZl2UYkDpzabth_CEkmDYOaLgbdiAA09Hdmw_SRhNKMsY5ZzujUA/exec";

        // Using URLSearchParams formats the data properly for Google Apps Script doPost
        var formData = new FormData(this);
        var data = new URLSearchParams();
        for (const pair of formData) {
          data.append(pair[0], pair[1]);
        }

        fetch(webAppUrl, {
          method: "POST",
          body: data
        })
          .then(response => response.text())
          .then(result => {
            submitBtn.disabled = false;
            messageDiv.innerText = result;

            if (result.includes("Success")) {
              messageDiv.style.color = "green";
              document.getElementById("correctionForm").reset(); // Clear the form
            } else {
              messageDiv.style.color = "red";
            }
          })
          .catch(error => {
            submitBtn.disabled = false;
            messageDiv.style.color = "red";
            messageDiv.innerText = "An error occurred. Check the console.";
            console.error('Error:', error);
          });
      });
    </script>
</body>

</html>
